# Shared by both the HTTP (:80) and HTTPS (:443) server blocks in nginx.conf.
# Single-origin routing: the browser only ever talks to this nginx; nginx fans
# out to each module over the internal Docker network. No CORS, no mixed content.

root /usr/share/nginx/html;
index index.html;
client_max_body_size 100m;   # voice audio uploads, document uploads

# Vault's axios client uses the bare /api prefix.
location /api/ {
    proxy_pass http://vault:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Per-module same-origin prefixes (/svc/<module>/... -> module:port/...).
# The trailing slash on both location and proxy_pass strips the /svc/<module> prefix.
location /svc/vault/     { proxy_pass http://vault:5000/;     proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
location /svc/vitara/    { proxy_pass http://vitara:5100/;    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
location /svc/aasthi/    { proxy_pass http://aasthi:5200/;    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
# Longer read/send timeout: chat requests can run San's agent tool loop
# (several model calls + tool executions), which San itself allows up to 5 minutes for.
location /svc/san/       { proxy_pass http://san:5300/;       proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 300s; proxy_send_timeout 300s; }
location /svc/sutra/     { proxy_pass http://sutra:5400/;     proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
location /svc/northstar/ { proxy_pass http://northstar:5500/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
location /svc/karma/     { proxy_pass http://karma:5600/;     proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
location /svc/nexus/     { proxy_pass http://nexus:5700/;     proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

# SPA fallback
location / {
    try_files $uri $uri/ /index.html;
}
