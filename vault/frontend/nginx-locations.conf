# Shared by both the HTTP (:80) and HTTPS (:443) server blocks in nginx.conf.
# Single-origin routing: the browser only ever talks to this nginx; nginx fans
# out to each module over the internal Docker network. No CORS, no mixed content.

root /usr/share/nginx/html;
index index.html;
client_max_body_size 100m;   # voice audio uploads, document uploads

# Re-resolve module hostnames at request time instead of once at startup.
#
# With a literal hostname in proxy_pass (`proxy_pass http://vault:5000;`) nginx
# resolves it a single time when a worker starts and caches the address for the life
# of the process. Every `docker compose up -d --build` recreates the backend
# containers on new bridge IPs while leaving this container running — so nginx keeps
# dialling addresses that no longer exist and answers 502 for every module, while the
# modules themselves are perfectly healthy on their published ports. It reads exactly
# like "the backend is down" and is very hard to tell apart from one.
#
# Naming Docker's embedded DNS server explicitly, and putting the upstream in a
# VARIABLE, forces a lookup per request honouring the 10s TTL below. Cost is one
# cached DNS query per 10s per module; benefit is that a rebuild stops silently
# severing the frontend from everything behind it.
resolver 127.0.0.11 valid=10s ipv6=off;

# NOTE: once proxy_pass contains a variable, nginx no longer strips the matched
# location prefix automatically — that only happens when the directive has a literal
# URI part. Each location below therefore rewrites the prefix off explicitly. Getting
# this wrong sends /svc/vault/api/... upstream verbatim and every call 404s, so the
# rewrite and the proxy_pass have to be read as a pair.
set $m_vault     vault:5000;
set $m_vitara    vitara:5100;
set $m_aasthi    aasthi:5200;
set $m_san       san:5300;
set $m_sutra     sutra:5400;
set $m_northstar northstar:5500;
set $m_karma     karma:5600;
set $m_nexus     nexus:5700;

# Vault's axios client uses the bare /api prefix — no prefix to strip here.
location /api/ {
    proxy_pass http://$m_vault;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Per-module same-origin prefixes (/svc/<module>/... -> module:port/...).
location /svc/vault/ {
    rewrite ^/svc/vault/(.*)$ /$1 break;
    proxy_pass http://$m_vault;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /svc/vitara/ {
    rewrite ^/svc/vitara/(.*)$ /$1 break;
    proxy_pass http://$m_vitara;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /svc/aasthi/ {
    rewrite ^/svc/aasthi/(.*)$ /$1 break;
    proxy_pass http://$m_aasthi;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
# Longer read/send timeout: chat requests can run San's agent tool loop
# (several model calls + tool executions), which San itself allows up to 5 minutes for.
location /svc/san/ {
    rewrite ^/svc/san/(.*)$ /$1 break;
    proxy_pass http://$m_san;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s; proxy_send_timeout 300s;
}
location /svc/sutra/ {
    rewrite ^/svc/sutra/(.*)$ /$1 break;
    proxy_pass http://$m_sutra;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /svc/northstar/ {
    rewrite ^/svc/northstar/(.*)$ /$1 break;
    proxy_pass http://$m_northstar;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /svc/karma/ {
    rewrite ^/svc/karma/(.*)$ /$1 break;
    proxy_pass http://$m_karma;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /svc/nexus/ {
    rewrite ^/svc/nexus/(.*)$ /$1 break;
    proxy_pass http://$m_nexus;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# SPA fallback
location / {
    try_files $uri $uri/ /index.html;
}
