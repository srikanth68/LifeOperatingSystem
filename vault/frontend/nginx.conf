# HTTP (:80) — for use on the Everest Mac itself (http://localhost:3000).
# The mic works on localhost without TLS.
server {
    listen 80;
    include /etc/nginx/snippets/maaya.conf;
}

# HTTPS (:443) — required for the mic (getUserMedia) over Meshnet / the .nord
# name, where browsers refuse camera/mic on plain HTTP. Uses a self-signed cert
# generated at image build; accept the one-time browser warning per device.
server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/maaya.crt;
    ssl_certificate_key /etc/nginx/certs/maaya.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/maaya.conf;
}
