# Vitara AI reasoning plan (June 2026) -- SUPERSEDED. Do not build from this.
#
# This file planned a reasoning pipeline that sent health data to a cloud model and had
# the model analyse biomarkers. Two standing rules now forbid both halves of that:
#
#   - No private health data is sent to a cloud AI model.
#   - Statistics make claims, machine learning predicts, and a language model only
#     explains what the statistics have already proved. No model computes, compares or
#     counts anything.
#
# The current specification is docs/VITARA-SPEC.html. The decision records, and the
# original text of this plan with the reasons it was dropped, are in the Vitara
# repository (docs/history/vitara-prd-plan.yaml).
#
# Kept rather than deleted so that older links into the repo still land somewhere that
# says where to go.

status: superseded
superseded_by: docs/VITARA-SPEC.html
