# Vitara web: the static app, and a same-origin route to exactly three things.
#
#   /svc/vault/api/auth/   the sign-in server -- ONLY its auth endpoints, nothing else of Maaya
#   /svc/vitara/           readings, labs, profiles
#   /svc/insight/          what the readings mean
#
# Everything else under /svc/ is a 404 from this server, so this container cannot be used to
# reach the rest of Maaya even by someone who knows its addresses.

# The native app (Capacitor) is the same app bundled onto the phone, so its pages come from its
# own origin -- capacitor://localhost on iOS, https://localhost on Android -- and its calls to
# /svc/ are cross-origin. Exactly those origins are allowed, nothing else: any other page that
# tries gets no Access-Control-Allow-Origin header back and the browser refuses it. (An empty
# value makes nginx leave the header out altogether.)
map $http_origin $vitara_cors_origin {
    default                  "";
    "capacitor://localhost"  $http_origin;
    "https://localhost"      $http_origin;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    # Re-resolve backend names per request. A literal hostname in proxy_pass is resolved once
    # when nginx starts, so every `docker compose up -d --build` of a backend would leave this
    # container dialling an address that no longer exists and answering 502 while the backend
    # is perfectly healthy. A variable plus Docker's resolver makes it look the name up again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Sent with every /svc/ answer (the proxy locations add no headers of their own, so they
    # inherit these). `always` puts them on 401s and 500s too, or a failed sign-in would surface
    # in the app as an unreadable network error instead of "wrong PIN".
    add_header Access-Control-Allow-Origin  $vitara_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Profile-Id" always;
    add_header Access-Control-Max-Age       600 always;
    add_header Vary                         Origin always;
    # The backends have CORS of their own for Maaya's frontend. Theirs is dropped here so a
    # response can never carry two Access-Control-Allow-Origin headers, which browsers reject.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Vary;

    set $m_vault   vault:5000;
    set $m_vitara  vitara:5100;
    set $m_insight vitara-insight:5110;

    # With a variable in proxy_pass nginx no longer strips the matched prefix itself, so each
    # block rewrites it off. The rewrite and the proxy_pass are a pair.
    location /svc/vault/api/auth/ {
        if ($request_method = OPTIONS) { return 204; }     # CORS preflight, answered here
        rewrite ^/svc/vault/(.*)$ /$1 break;
        proxy_pass http://$m_vault;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Apple Health's own export is hundreds of MB and is parsed after it arrives: no body
    # buffering (it would be spooled to disk and written twice), a large limit, long timeouts.
    location /svc/vitara/api/healthimport/ {
        if ($request_method = OPTIONS) { return 204; }     # CORS preflight, answered here
        rewrite ^/svc/vitara/(.*)$ /$1 break;
        proxy_pass http://$m_vitara;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_body_timeout 1800s;
    }

    location /svc/vitara/ {
        if ($request_method = OPTIONS) { return 204; }     # CORS preflight, answered here
        rewrite ^/svc/vitara/(.*)$ /$1 break;
        proxy_pass http://$m_vitara;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /svc/insight/ {
        if ($request_method = OPTIONS) { return 204; }     # CORS preflight, answered here
        rewrite ^/svc/insight/(.*)$ /$1 break;
        proxy_pass http://$m_insight;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Anything else asked of /svc/ ends here.
    location /svc/ { return 404; }

    # Hashed assets never change under the same name; the page itself must always be re-checked.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    # The service worker and the manifest must never be served from an old cache, or an update
    # to the app could not reach a phone that already has it installed.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; try_files $uri =404; }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
